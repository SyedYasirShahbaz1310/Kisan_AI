services:
  - type: web
    name: kisan-ai-assistant
    runtime: python
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AUTO_WATCH
        value: 0
      - key: PORT
        value: 10000
    healthCheckPath: /
    autoDeploy: true
